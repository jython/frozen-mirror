language: java

notifications:
  email:
    recipients:
      - jython-dev@lists.sourceforge.net

matrix:
  include:
    # TEMPORARILY DISABLE Linux  
    #- name: "Linux: Default JDK"
    #  os: linux
    #  env: CUSTOM_JDK="default"
    #- name: "Linux: Open JDK 7"
    #  os: linux
    #  env: CUSTOM_JDK="openjdk7"
    #- name: "Linux: Oracle JDK 8"
    #  os: linux
    #  env: CUSTOM_JDK="oraclejdk8"
    - name: "macOS: Default JDK"
      os: osx
      env: JAVA_HOME=$(/usr/libexec/java_home)
      before_install:  # overrides the before_install
        - brew install ant
    - name: "Windows: Default JDK (jre8 only)"
      os: windows
      language: bash  # language: java is not yet supported on Travis CI Windows
      env: PATH="/c/Program Files/Java/jdk1.8.0_211/bin:/c/ProgramData/chocolatey/lib/ant:$PATH"
      before_install:  # overrides the before_install
        - choco install javaruntime 
        #- cat /c/ProgramData/chocolatey/logs/chocolatey.log || true  # too long for Travis CI!
    - name: "Windows: Default JDK - No JDK (jre and ant)"
      os: windows
      language: bash  # language: java is not yet supported on Travis CI Windows
      env: PATH="/c/Program Files/Java/jdk1.8.0_211/bin:/c/ProgramData/chocolatey/lib/ant:$PATH"
      before_install:
        - choco install javaruntime   # overrides the before_install
        - choco install ant  # overrides the before_install
        #- cat /c/ProgramData/chocolatey/logs/chocolatey.log || true  # too long for Travis CI!
    - name: "Windows: Default JDK (jre, ant, and jdk)"
      os: windows
      language: bash  # language: java is not yet supported on Travis CI Windows
      env: PATH="/c/Program Files/Java/jdk1.8.0_211/bin:/c/ProgramData/chocolatey/lib/ant:$PATH"
      before_install:  # overrides the before_install
        - choco install javaruntime 
        - choco install jdk8 ant # overrides the before_install
        #- cat /c/ProgramData/chocolatey/logs/chocolatey.log || true  # too long for Travis CI!

before_install: jdk_switcher use "$CUSTOM_JDK"

install:
  # Patch for buffer overflow bug, see https://github.com/travis-ci/travis-ci/issues/5227
  - hostname
  - cat /etc/hosts # optionally check the content *before*
  - sudo hostname "$(hostname | cut -c1-63)"
  - sed -e "s/^\\(127\\.0\\.0\\.1.*\\)/\\1 $(hostname | cut -c1-63)/" /etc/hosts | sudo tee /etc/hosts
  - hostname
  - cat /etc/hosts # optionally check the content *after*

script: ant && ant regrtest-travis
